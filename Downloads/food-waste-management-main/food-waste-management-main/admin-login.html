<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Admin Login - Musaliar Tracking</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="dark-theme">
    <div class="login-wrapper">
        <div class="login-card">
            <h2>Super Admin Portal</h2>
            <div class="input-group">
                <label>Email Address</label>
                <input type="email" id="adminEmail" placeholder="musaliar123@gmail.com" value="musaliar123@gmail.com">
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="adminPassword" placeholder="Enter password" value="Password@123">
            </div>
            <button class="btn" id="adminLoginBtn">Login to Dashboard</button>
            <p style="margin-top: 15px;"><a href="index.html" style="color: var(--primary);">Return Home</a></p>
        </div>
    </div>

    <script type="module" src="js/admin-auth.js"></script>
</body>

</html>
