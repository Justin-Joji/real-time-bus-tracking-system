<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCET Live Bus Tracking</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="app-container">
        <!-- Header -->
        <header class="glass-header">
            <div class="logo">
                <img src="https://ui-avatars.com/api/?name=MCET&background=0D8ABC&color=fff&rounded=true"
                    alt="MCET Logo" class="logo-img">
                <div class="header-text">
                    <h1>MCET Bus Tracker</h1>
                    <p>Live Location System</p>
                </div>
            </div>
            <div class="header-actions">
                <a href="driver.html" class="btn btn-outline">Driver Login</a>
            </div>
        </header>

        <!-- Main Map Area -->
        <main class="map-container">
            <div id="map"></div>

            <!-- Floating Overlay for Bus Info -->
            <div class="bus-info-overlay glass-panel">
                <div class="bus-selector">
                    <label for="busSelect">Select Route / Bus to Track</label>
                    <select id="busSelect">
                        <option value="">Fetching active buses...</option>
                    </select>
                </div>

                <div class="tracking-details" id="trackingDetails" style="display: none;">
                    <div class="status-indicator">
                        <span class="pulse-dot"></span>
                        <span id="busStatusText">Live Tracking Active</span>
                    </div>

                    <div class="info-grid">
                        <div class="info-item">
                            <span class="info-label">Current Speed</span>
                            <span class="info-value" id="busSpeed">0 km/h</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">Last Updated</span>
                            <span class="info-value" id="lastUpdated">Just now</span>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script type="module" src="js/firebase-config.js"></script>
    <script type="module" src="js/app.js"></script>
</body>

</html>
